name: edutn6_app
description: "EduTN 6eme - plateforme educative pour la sixieme annee (Tunisie)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # TODO(production): google_fonts telecharge la police Cairo a la volee au
  # premier lancement (voir lib/core/theme/app_theme.dart). Avant la mise en
  # production, bundler Cairo en asset local (police + entree `fonts:` dans
  # ce pubspec.yaml) pour supprimer toute dependance reseau au rendu texte.
  # Voir lib/core/theme/README.md, section "RTL et langue".
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
